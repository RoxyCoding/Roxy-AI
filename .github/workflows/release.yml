# Builds the Windows installer on a GitHub-hosted runner and, once the project is set up on
# SignPath Foundation, has it signed there (https://signpath.org).
#
# Repository settings needed for signing (Settings -> Secrets and variables -> Actions):
#   secret   SIGNPATH_API_TOKEN          API token of the SignPath CI user
#   variable SIGNPATH_ORGANIZATION_ID    SignPath organization ID
#   variable SIGNPATH_PROJECT_SLUG       e.g. roxy-ai
#   variable SIGNPATH_SIGNING_POLICY     e.g. release-signing
# Without them the workflow still builds and uploads an unsigned installer.
#
# Push a tag such as v0.1.0 to publish a GitHub release with the (signed) installer.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: ./scripts/setup.ps1

      - name: Test backend
        working-directory: backend
        run: .venv\Scripts\python.exe -m pytest -q

      - name: Build installer (distribution)
        run: ./scripts/build.ps1 -Distribution

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: roxy-ai-installer-unsigned
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: roxy-ai-installer
          path: signed/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'signed/*.exe' || 'app/src-tauri/target/release/bundle/nsis/*.exe' }}
