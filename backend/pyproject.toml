[project]
name = "roxy-blender-ai-backend"
version = "0.1.6"
description = "Roxy AI: local backend (FastAPI) for the desktop chat GUI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "claude-agent-sdk>=0.2.160",
    # Same major as Roxy-BlenderMCP-v2 (mcp>=1.26,<2).
    "mcp>=1.26,<2",
    "pillow>=10",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6"]

[project.scripts]
roxy-blender-ai-backend = "roxy_ai.__main__:main"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roxy_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
